[package]
name = "maddentool"
description = "Madden 27 franchise and draft companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "maddentool_lib"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "maddentool"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "=2.12.5", features = ["test"] }

[lints]
workspace = true
