[package]
name = "mt-store"
description = "MaddenTool historical player database: SQLite schema, migrations, importers and queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mt-data"
path = "src/bin/mt-data.rs"

[dependencies]
# Bundled SQLite gives the same engine on Windows, macOS and Linux.
rusqlite = { version = "0.41.1", features = ["bundled"] }
csv = "1.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
