[package]
name = "mt-draft-format"
description = "MaddenTool Madden 27 draft-class reader: header and record validation, field map, unknown bytes, inspect CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mt-draft"
path = "src/bin/mt-draft.rs"

[dependencies]
# No serde_json features: `preserve_order` or `float_roundtrip` would unify into
# mt-store when the workspace builds together and change its JSON behaviour.
# Key order and exact text are kept through the raw JSON bytes instead.
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
